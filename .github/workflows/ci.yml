name: LinguaTale CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  java-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/java-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test

  python-ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai/linguatale-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall app
