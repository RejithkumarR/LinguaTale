spring:
  application:
    name: linguatale-api
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/linguatale?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USERNAME:linguatale}
    password: ${MYSQL_PASSWORD:linguatale}
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: ${SERVER_PORT:8080}

linguatale:
  queue:
    generation: ${GENERATION_QUEUE:linguatale.generation}
  ai:
    callback-secret: ${AI_CALLBACK_SECRET:change-me}
